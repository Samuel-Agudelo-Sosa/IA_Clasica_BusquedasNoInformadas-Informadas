<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor de Búsqueda IA</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">IA Engine</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Simulador</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Teoría</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Guía de Uso</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <div class="container">
        <div class="row">
            <!-- Panel de Configuración -->
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Configuración de Búsqueda</h5>
                    </div>
                    <div class="card-body">
                        <form id="searchForm">
                            
                            <!-- Selección del Problema -->
                            <div class="mb-3">
                                <label for="problemSelect" class="form-label fw-bold">Problema</label>
                                <select class="form-select" id="problemSelect" required>
                                    <option value="missionaries">Misioneros y Caníbales</option>
                                    <option value="horarios">Asignación de Horarios (CSP)</option>
                                </select>
                            </div>

                            <!-- Selección del Algoritmo -->
                            <div class="mb-3">
                                <label for="algoSelect" class="form-label fw-bold">Algoritmo</label>
                                <select class="form-select" id="algoSelect" required>
                                    <optgroup label="No Informados">
                                        <option value="BFS">Amplitud (BFS)</option>
                                        <option value="DFS">Profundidad (DFS)</option>
                                        <option value="DLS">Prof. Limitada (DLS)</option>
                                        <option value="IDFS">Prof. Iterativa (IDFS)</option>
                                        <option value="UCS">Costo Uniforme (UCS)</option>
                                    </optgroup>
                                    <optgroup label="Informados">
                                        <option value="AStar">A* (A-Star)</option>
                                        <option value="Avara">Avara (Greedy)</option>
                                    </optgroup>
                                </select>
                            </div>

                            <!-- Nivel de Control de Redundancia -->
                            <div class="mb-3">
                                <label for="controlSelect" class="form-label fw-bold">Control de Redundancia</label>
                                <select class="form-select" id="controlSelect">
                                    <option value="0">Nivel 0: Sin control (Grafo infinito)</option>
                                    <option value="1">Nivel 1: Evitar devolverse al padre</option>
                                    <option value="2">Nivel 2: Evitar ciclos en la rama</option>
                                    <option value="3" selected>Nivel 3: Historial global (Recomendado)</option>
                                </select>
                            </div>

                            <!-- Parámetros Extra (Se mostrarán dinámicamente con JS) -->
                            <div class="mb-3" id="extraParams" style="display: none;">
                                <label for="depthLimit" class="form-label fw-bold">Límite de Profundidad (DLS)</label>
                                <input type="number" class="form-control" id="depthLimit" value="10" min="1">
                            </div>

                            <button type="submit" class="btn btn-success w-100 fw-bold">Ejecutar Búsqueda</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Panel de Resultados -->
            <div class="col-md-8">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="mb-0">Resultados y Visualización</h5>
                    </div>
                    <div class="card-body">
                        <div id="resultsArea" class="text-center text-muted mt-5">
                            <p>Configura los parámetros y presiona "Ejecutar Búsqueda" para ver los resultados aquí.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
